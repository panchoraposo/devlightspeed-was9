schemaVersion: 2.2.0
metadata:
  name: mta-was9-lightspeed
  displayName: MTA WAS9 → Quarkus (Developer Lightspeed)
  description: Analyze WAS9/Liberty FSI apps under source-apps/ with MTA and Developer Lightspeed in OpenShift Dev Spaces
  tags: [Java, MTA, Lightspeed, WebSphere, Quarkus]
  projectType: java
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 8Gi
      memoryRequest: 2Gi
      cpuLimit: "4"
      cpuRequest: "500m"
      mountSources: true
      endpoints:
        - name: http-accounts
          targetPort: 8088
        - name: http-default
          targetPort: 8080
      env:
        # UDI RHEL9 has OpenJDK under /usr/lib/jvm but NOT /usr/bin/java.
        # Put JAVA_HOME/bin first so Che-Code extensionHost (and MTA Java) can find java.
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-17-openjdk
        - name: JDK_HOME
          value: /usr/lib/jvm/java-17-openjdk
        - name: USE_JAVA17
          value: "true"
        - name: PATH
          value: /usr/lib/jvm/java-17-openjdk/bin:/home/user/.local/bin:/home/user/mta:/home/user/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: MAVEN_OPTS
          value: "-Xmx1g"
        - name: MTA_HOME
          value: /home/user/mta
        # Optional: override MTA Hub URL from secret storage (no trailing space).
        # - name: HUB_URL
        #   value: https://mta-openshift-mta.apps.example.com
        # - name: HUB_INSECURE
        #   value: "true"
        # - name: FORCE_HUB_ENABLED
        #   value: "true"
commands:
  - id: bootstrap-workspace
    exec:
      label: Bootstrap MTA CLI + JDK + VS Code settings
      component: tools
      commandLine: bash scripts/bootstrap-workspace.sh
      workingDir: ${PROJECT_SOURCE}
  - id: install-jdk17
    exec:
      label: Install user-local Temurin JDK 17 (fallback)
      component: tools
      commandLine: bash scripts/install-jdk17.sh
      workingDir: ${PROJECT_SOURCE}
  - id: install-jdk25
    exec:
      label: Install Temurin JDK 25 for Java language server
      component: tools
      commandLine: bash scripts/install-jdk25.sh
      workingDir: ${PROJECT_SOURCE}

  - id: install-mta-cli
    exec:
      label: Install Linux MTA/Kantra CLI (into ~/mta)
      component: tools
      commandLine: bash scripts/install-mta-cli.sh
      workingDir: ${PROJECT_SOURCE}
  - id: install-mta-extensions
    exec:
      label: Install MTA VS Code extensions (download VSIX)
      component: tools
      commandLine: bash scripts/install-mta-extensions.sh
      workingDir: ${PROJECT_SOURCE}
  - id: package-accounts
    exec:
      label: Maven package fsi-accounts-was9-legacy
      component: tools
      commandLine: mvn -q -f source-apps/fsi-accounts-was9-legacy/pom.xml package
      workingDir: ${PROJECT_SOURCE}
  - id: package-cards
    exec:
      label: Maven package fsi-cards-was9-legacy
      component: tools
      commandLine: mvn -q -f source-apps/fsi-cards-was9-legacy/pom.xml package
      workingDir: ${PROJECT_SOURCE}
  - id: package-kyc
    exec:
      label: Maven package fsi-kyc-was9-legacy
      component: tools
      commandLine: mvn -q -f source-apps/fsi-kyc-was9-legacy/pom.xml package
      workingDir: ${PROJECT_SOURCE}
  - id: mta-hint
    exec:
      label: Print MTA / Lightspeed profile hint
      component: tools
      commandLine: |
        echo "1) Project java -version (JAVA_HOME=/usr/lib/jvm/java-17-openjdk); JDT LS needs ~/jdk-25"
        echo "2) If Java extension says 'JDK 25 required': run 'Install Temurin JDK 25 for Java language server', Reload Window"
        echo "3) MTA extensions: wait for postStart VSIX download, or run 'Install MTA VS Code extensions', then Reload Window"
        echo "   (Do not rely on the MTA 'Install Extension Pack' button — it often no-ops in Che-Code)"
        echo "4) Run 'Install Linux MTA/Kantra CLI' if ~/mta/linux-mta-cli is missing (~700MB)"
        echo "5) Analyze ONE folder under source-apps/ (e.g. source-apps/fsi-accounts-was9-legacy)"
        echo "6) Do NOT analyze repo root or migrated-apps/ (already Quarkus)"
        echo "7) Analysis profile: source=websphere, targets=quarkus,openjdk17"
        echo "8) Configure LLM: MTA: Open the Gen AI model provider configuration file"

      workingDir: ${PROJECT_SOURCE}
events:
  postStart:
    - bootstrap-workspace
